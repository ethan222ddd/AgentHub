name: Windows checks and installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the pinned Electron binary is installed
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - name: Check source-only tracking
        shell: pwsh
        run: |
          $generated = @(git ls-files -- release dist .local .native node_modules test-results playwright-report '*.sqlite*' '.env*')
          if ($generated.Count) { throw 'Generated or private data must not be tracked' }
      - run: npm test
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        with:
          name: AgentHub-Windows-x64
          path: |
            release/*/AgentHub Setup *.exe
            release/*/AgentHub-*-portable.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: AgentHub-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Native paid-account tests are deliberately opt-in local commands, never CI secrets.
