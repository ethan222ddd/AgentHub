name: Windows checks and installer
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure the pinned Electron binary is installed
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
      - name: Check source-only tracking
        shell: pwsh
        run: |
          $generated = @(git ls-files -- release dist .local .native node_modules test-results playwright-report '*.sqlite*' '.env*')
          if ($generated.Count) { throw 'Generated or private data must not be tracked' }
      - name: Run offline unit and integration tests
        run: |
          New-Item -ItemType Directory -Force .local/ci | Out-Null
          npm test -- --reporter=default --reporter=json --outputFile=.local/ci/unit.json
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Run Electron end-to-end tests
        run: npx playwright test --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .local/ci/e2e.json
      - name: Clean NSIS install, reinstall and uninstall
        run: npx tsx scripts/ci-installed-smoke.ts
      - uses: actions/upload-artifact@v7
        with:
          name: AgentHub-Windows-x64-${{ matrix.os }}
          path: |
            release/*/AgentHub Setup *.exe
            release/*/AgentHub-*-portable.exe
            release/*/AgentHub-*-UserGuide.html
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AgentHub-test-reports-${{ matrix.os }}
          path: |
            .local/ci/*.json
            .local/ci-installer/report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: AgentHub-test-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Native paid-account tests are deliberately opt-in local commands, never CI secrets.
